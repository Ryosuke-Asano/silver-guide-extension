<h1>公開デモを開く</h1><p>フォームとPDF入力を、通常のWebページで試せます。</p>
<p><a id="demo-site-link" class="yk-button yk-button-primary" href="https://ryosuke-asano.github.io/silver-guide-extension/">デモページを開く</a></p>
