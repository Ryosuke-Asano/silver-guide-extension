<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>架空の案内 — Hidden stages fixture</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/forms.css"></head>
<body><main>
  <h1>架空の案内</h1><p class="fixture-notice">外部への接続を行わないローカルテストです。</p>
  <section id="old-stage"><h2>第1画面</h2><p id="old-explanation">住民票を確認します。</p></section>
  <section id="new-stage" hidden><h2>第2画面</h2><p id="new-explanation">年金を確認します。</p></section>
  <button id="change-screen" type="button">第2画面を表示する</button>
  <button id="make-editable" type="button">説明を編集可能にする (ローカルテスト)</button>
</main><script>
document.querySelector('#change-screen').addEventListener('click', () => {
  document.querySelector('#old-stage').hidden = true;
  document.querySelector('#new-stage').hidden = false;
});
document.querySelector('#make-editable').addEventListener('click', () => {
  const explanation = document.querySelector('#new-explanation');
  explanation.setAttribute('contenteditable', 'true');
  explanation.setAttribute('role', 'textbox');
});
</script></body></html>
