name: Desktop demo

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  demo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - run: npm install --global pnpm@10.13.1
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - run: node scripts/build-extension.mjs --chromium
      - run: pnpm exec vitest run tests/dev --no-file-parallelism --maxWorkers=1
        env:
          SILVERGUIDE_DEMO_SMOKE: "1"
